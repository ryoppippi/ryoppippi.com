  '@ox-content/islands': 3.10.0
  '@ox-content/napi': 3.10.0
  '@ox-content/theme-color-kanagawa': 3.10.0
  '@ox-content/vite-plugin': 3.10.0
  '@ox-content/vite-plugin-svelte': 3.10.0
  '@rsvelte/vite-plugin-svelte': 0.5.4
  '@tanstack/charts': 1.5.0
  '@types/d3-scale': ^4.0.9
  '@types/d3-shape': ^3.2.0
  '@types/fs-extra': ^11.0.4
  '@types/node': ^26.6.10
  '@typescript/native': npm:typescript@^7.0.2
  budoux: ^0.10.4
  d3-scale: ^4.0.3
  d3-shape: ^3.2.1
  fs-extra: ^11.4.1
  fs-fixture: ^2.16.2
  msw: ^3.0.7
  only-allow: ^1.2.2
