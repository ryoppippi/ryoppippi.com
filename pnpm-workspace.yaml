minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@ox-content/*'

overrides:
  sharp: ^0.35.5

shellEmulator: true

# Security settings (supply chain attack prevention)
# See: https://pnpm.io/settings

# Blocks lifecycle scripts (postinstall, etc.) from running in dependencies by default
# Only packages listed in allowBuilds can run build scripts
# Prevents Shai-Hulud-style worm attacks that exploit automatic script execution
strictDepBuilds: true

# true: allow build scripts, false: block build scripts
allowBuilds:
  core-js: true
  esbuild: true
  msw: false
  puppeteer: false
  sharp: true
  unrs-resolver: true
  workerd: true

# Blocks dependencies from non-registry sources (Git repos, tarball URLs)
# Prevents PhantomRaven-style attacks that bypass npm scanning
blockExoticSubdeps: true

# Prevents trust level downgrades between package versions
# Blocks installations when publisher credentials downgrade from GitHub OIDC to basic auth
trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  # semver 6.x predates npm provenance; later 7.x releases have it, which the
  # date-based check reads as a downgrade. 6.3.1 is the long-standing Babel
  # dependency.
  - semver@6.3.1
  # chromium-bidi's Chromium-numbered builds are published by Google's
  # chrome-devtools-npm maintainer without provenance, while its semver releases
  # use GitHub OIDC, so the check reads them as a downgrade. puppeteer-core pins
  # this exact build.
  - chromium-bidi@157.0.8090-0
permissions:
  '@tanstack/charts':
    skills:
      [
        build-chart-interactions,
        compose-marks-and-views,
        configure-scales-guides-color,
        coordinate-charts-with-tanstack,
        debug-and-verify-charts,
        design-a-chart,
        design-responsive-charts,
        extend-tanstack-charts,
        migrate-to-tanstack-charts,
        prepare-chart-data,
        ship-accessible-charts,
        update-and-animate-charts,
      ]
  fs-fixture:
    skills: true
skills:
  dirs:
    - .agents/skills
    - .claude/skills
