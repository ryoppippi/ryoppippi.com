name: CI

on:
  push:
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run Gitleaks
        run: nix develop --command gitleaks detect --source . --config .gitleaks.toml

      - name: Run Typo Check
        run: nix develop --command vp run typos

      - name: Run Vite+ Check
        run: nix develop --command vp check

      - name: Run Tests
        run: nix develop --command vp test --run

  action-timeline:
    needs:
      - ci
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      - uses: Kesin11/actions-timeline@7bf79990b7c09f5dfb570ac30b814ca597bd538e # v3.1
