name: CI

on:
  push:
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run Gitleaks
        run: nix develop .#ci --command gitleaks detect --source . --config .gitleaks.toml

      - name: Run Typo Check
        run: nix develop .#ci --command pnpm run typos

      - name: Run Vite+ Check
        run: nix develop .#ci --command pnpm run check

      - name: Run Tests
        run: nix develop .#ci --command pnpm run test

  action-timeline:
    needs:
      - ci
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2
