name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - parallel:
          - name: Run Gitleaks
            run: gitleaks detect --source . --config .gitleaks.toml
          - name: Run Typo Check
            run: pnpm run typos
          - name: Run Vite+ Check
            run: pnpm run check
          - name: Run Tests
            run: pnpm run test
