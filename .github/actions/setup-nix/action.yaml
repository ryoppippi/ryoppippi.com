name: Setup Nix
description: Install Nix and load the CI development environment
inputs:
  frozen-lockfile:
    description: Fail instead of updating pnpm-lock.yaml when it is out of date
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        github_access_token: ${{ github.token }}
        nix_conf: |
          max-jobs = auto

    - name: Load CI tools and install JavaScript dependencies
      shell: bash
      env:
        FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: |
        if [ "$FROZEN_LOCKFILE" = true ]; then
          lockfile_flag=--frozen-lockfile
        else
          lockfile_flag=--no-frozen-lockfile
        fi
        nix develop .#ci --command bash -euo pipefail -c '
          pnpm install "$1"
          printf "%s\\n" "$PATH" | tr ":" "\\n" >> "$GITHUB_PATH"
        ' bash "$lockfile_flag"
