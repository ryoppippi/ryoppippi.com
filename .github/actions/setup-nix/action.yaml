name: Setup Nix
description: Install Nix with the Hestia binary cache and load the CI development environment
inputs:
  frozen-lockfile:
    description: Fail instead of updating pnpm-lock.yaml when it is out of date
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install Nix and configure the shared cache
      uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1

    - name: Load CI tools and install JavaScript dependencies
      shell: bash
      env:
        FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: |
        if [ "$FROZEN_LOCKFILE" = true ]; then
          lockfile_flag=--frozen-lockfile
        else
          lockfile_flag=--no-frozen-lockfile
        fi
        nix develop .#ci --command bash -euo pipefail -c '
          pnpm install "$1"
          printf "%s\\n" "$PATH" | tr ":" "\\n" >> "$GITHUB_PATH"
        ' bash "$lockfile_flag"
